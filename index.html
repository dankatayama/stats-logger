<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stats Logger PWA</title>

  <!-- PWA & iOS Home Screen Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StatsLog" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Tailwind CSS for mobile-first UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for Dashboard Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Identity Services & API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">

  <div class="max-w-md mx-auto p-4 space-y-6">
    <!-- Top Bar / Auth & Gear Status -->
    <header class="flex items-center justify-between border-b pb-3">
      <div class="flex items-center space-x-3">
        <h1 class="text-xl font-bold text-blue-600">Stats Logger</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button id="authBtn" onclick="handleAuthClick()" class="text-xs bg-blue-600 text-white px-2.5 py-1.5 rounded-lg font-medium shadow-sm">
          Sign in
        </button>
        <button onclick="openConfigScreen()" class="p-2 text-slate-600 hover:text-slate-900 bg-white border border-slate-200 rounded-lg shadow-sm" title="Configuration">
          ⚙️
        </button>
      </div>
    </header>

    <!-- SCREEN 1: MAIN / HOME -->
    <section id="homeScreen" class="space-y-4">
      <div>
        <label for="dashboardSelect" class="block text-sm font-medium text-slate-700 mb-1">
          Select Dashboard
        </label>
        <select id="dashboardSelect" onchange="onDashboardChange()" class="w-full rounded-lg border border-slate-300 bg-white p-3 text-base shadow-sm focus:border-blue-500 focus:outline-none">
        </select>
        <p id="dashboardDescPreview" class="text-xs text-slate-500 mt-1"></p>
      </div>

      <div class="grid grid-cols-1 gap-3 pt-2">
        <button onclick="openLogScreen()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow">
          Log Entry
        </button>
        <button onclick="openDashboardView()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow">
          Open Dashboard (Charts)
        </button>
      </div>
    </section>

    <!-- SCREEN 2: LOG SCREEN -->
    <section id="logScreen" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 id="logDashboardTitle" class="text-lg font-bold"></h2>
          <p id="logDashboardDesc" class="text-xs text-slate-500"></p>
        </div>
        <div class="space-x-2">
          <button onclick="openDashboardView()" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1.5 rounded font-medium">Dashboard</button>
          <button onclick="showScreen('homeScreen')" class="text-xs text-slate-500 hover:text-slate-800">Cancel</button>
        </div>
      </div>

      <form id="logForm" onsubmit="submitLog(event)" class="space-y-4">
        <div id="metricsInputsContainer" class="space-y-3"></div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
          <textarea id="logNotes" rows="3" placeholder="Optional session notes..." class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-xl shadow">
          Save to Google Sheets
        </button>
      </form>
    </section>

    <!-- SCREEN 3: DASHBOARD CHARTS VIEW -->
    <section id="dashboardViewScreen" class="hidden space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <div>
          <h2 id="chartDashboardTitle" class="text-lg font-bold text-indigo-700"></h2>
          <p class="text-xs text-slate-500">Last 10 entries with ideal ranges</p>
        </div>
        <button onclick="showScreen('homeScreen')" class="text-sm bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded-lg font-medium">Back</button>
      </div>
      <div id="chartsContainer" class="space-y-4 pb-4"></div>
    </section>

    <!-- SCREEN 4: CONFIGURATION SCREEN -->
    <section id="configScreen" class="hidden space-y-6">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="text-lg font-bold">Configuration</h2>
        <button onclick="showScreen('homeScreen')" class="text-sm text-blue-600 font-medium">Done</button>
      </div>

      <!-- Manage Dashboards -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3 shadow-sm">
        <h3 class="font-semibold text-sm uppercase tracking-wider text-slate-500">1. Manage Dashboards</h3>
        <div id="configDashboardsList" class="space-y-2"></div>

        <div class="border-t pt-3 space-y-2">
          <input id="newDashboardTitle" type="text" placeholder="Dashboard Title (e.g., Aquarium)" class="w-full border rounded-lg p-2 text-sm" />
          <input id="newDashboardDesc" type="text" placeholder="Description" class="w-full border rounded-lg p-2 text-sm" />
          <button onclick="saveDashboard()" id="saveDashboardBtn" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm font-medium">
            Add Dashboard
          </button>
        </div>
      </div>

      <!-- Manage Metrics for Selected Dashboard -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3 shadow-sm">
        <div class="flex items-center justify-between">
          <h3 class="font-semibold text-sm uppercase tracking-wider text-slate-500">2. Manage Metrics</h3>
          <span id="configActiveDashboardBadge" class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-medium"></span>
        </div>

        <div id="configMetricsList" class="space-y-2"></div>

        <div class="border-t pt-3 space-y-2">
          <input id="newMetricTitle" type="text" placeholder="Metric Title (e.g., PH)" class="w-full border rounded-lg p-2 text-sm" />
          <input id="newMetricDesc" type="text" placeholder="Metric Description (e.g., PH Levels)" class="w-full border rounded-lg p-2 text-sm" />
          <div class="grid grid-cols-3 gap-2">
            <input id="newMetricUnit" type="text" placeholder="Unit (ppm)" class="border rounded-lg p-2 text-sm" />
            <input id="newMetricMin" type="number" step="any" placeholder="Min Range" class="border rounded-lg p-2 text-sm" />
            <input id="newMetricMax" type="number" step="any" placeholder="Max Range" class="border rounded-lg p-2 text-sm" />
          </div>
          <button onclick="saveMetric()" id="saveMetricBtn" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm font-medium">
            Add Metric
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    // --- STATE & GOOGLE API CONFIG ---
    const CLIENT_ID = '553076189576-5ro6vh4g64m50vs518unm7e1sck6r5kp.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    let accessToken = localStorage.getItem('stats_access_token') || null;
    let tokenExpiry = Number(localStorage.getItem('stats_token_expiry')) || 0;
    let spreadsheetId = localStorage.getItem('stats_spreadsheet_id') || null;
    let editingDashboardIndex = null;
    let editingMetricIndex = null;
    let activeCharts = [];

    let appData = {
      dashboards: [
        {
          sheetId: 0,
          title: 'Daily Vitals',
          description: 'Morning health and body metrics',
          metrics: [
            { title: 'Weight', description: 'Post-wake weigh in', unit: 'kg', min: 50, max: 100 },
            { title: 'Resting HR', description: 'Seated pulse', unit: 'bpm', min: 60, max: 100 }
          ],
          rows: []
        }
      ]
    };

    function showScreen(screenId) {
      ['homeScreen', 'logScreen', 'dashboardViewScreen', 'configScreen'].forEach(id => {
        document.getElementById(id).classList.toggle('hidden', id !== screenId);
      });
      window.location.hash = screenId.replace('Screen', '');
      renderUI();
    }

    function renderUI() {
      const select = document.getElementById('dashboardSelect');
      const currentIdx = select.selectedIndex >= 0 ? select.selectedIndex : 0;
      select.innerHTML = appData.dashboards.map((g, idx) =>
        `<option value="${idx}" ${idx === currentIdx ? 'selected' : ''}>${g.title}</option>`
      ).join('');

      const activeGroup = appData.dashboards[select.value] || appData.dashboards[0];
      document.getElementById('dashboardDescPreview').textContent = activeGroup ? activeGroup.description : '';
    }

    function onDashboardChange() {
      renderUI();
    }

    async function openLogScreen() {
      const idx = document.getElementById('dashboardSelect').value;
      const group = appData.dashboards[idx];
      if (!group) return alert('Please create a dashboard first.');

      document.getElementById('logDashboardTitle').textContent = group.title;
      document.getElementById('logDashboardDesc').textContent = group.description;
      document.getElementById('logNotes').value = '';

      if (isTokenValid() && spreadsheetId) {
        await fetchDashboardRows(group);
      }

      const lastRow = group.rows && group.rows.length > 0 ? group.rows[group.rows.length - 1] : null;

      const container = document.getElementById('metricsInputsContainer');
      container.innerHTML = group.metrics.map((m, i) => {
        const rangeText = (m.min !== '' && m.min != null && m.max !== '' && m.max != null) 
          ? `${m.unit} (${m.min}-${m.max})` 
          : m.unit;

        let prevInfo = '<span class="text-xs text-slate-400">Previous: None</span>';
        if (lastRow && lastRow[i + 1] !== undefined && lastRow[i + 1] !== '') {
          const prevVal = lastRow[i + 1];
          const prevDate = lastRow[0] ? new Date(lastRow[0]).toLocaleDateString() : '';
          prevInfo = `<span class="text-xs text-slate-600 font-medium">Previous: ${prevVal} ${m.unit} <span class="text-slate-400 font-normal">(${prevDate})</span></span>`;
        }

        return `
          <div class="bg-white p-3 rounded-lg border border-slate-200 space-y-1.5">
            <div class="flex justify-between items-baseline">
              <label class="text-sm font-semibold text-slate-800">${m.title}</label>
              <span class="text-xs font-medium text-blue-600">${rangeText}</span>
            </div>
            <p class="text-xs text-slate-500">${m.description}</p>
            <div class="pt-1">${prevInfo}</div>
            <input type="number" step="any" data-metric-idx="${i}" data-min="${m.min !== undefined ? m.min : ''}" data-max="${m.max !== undefined ? m.max : ''}" 
              placeholder="Enter ${m.title.toLowerCase()}..." oninput="checkMetricRange(this)"
              class="metric-input w-full rounded border border-slate-300 p-2 text-sm focus:border-blue-500 focus:outline-none transition-colors mt-1" />
          </div>
        `;
      }).join('');

      showScreen('logScreen');
    }

    function checkMetricRange(input) {
      const val = parseFloat(input.value);
      const min = input.dataset.min !== "" ? parseFloat(input.dataset.min) : null;
      const max = input.dataset.max !== "" ? parseFloat(input.dataset.max) : null;

      if (isNaN(val) || input.value.trim() === "") {
        input.classList.remove('bg-red-50', 'border-red-500', 'text-red-900');
        return;
      }

      let outOfRange = false;
      if (min !== null && val < min) outOfRange = true;
      if (max !== null && val > max) outOfRange = true;

      if (outOfRange) {
        input.classList.add('bg-red-50', 'border-red-500', 'text-red-900');
      } else {
        input.classList.remove('bg-red-50', 'border-red-500', 'text-red-900');
      }
    }

    async function submitLog(e) {
      e.preventDefault();
      const idx = document.getElementById('dashboardSelect').value;
      const group = appData.dashboards[idx];
      const timestamp = new Date().toISOString();
      const metricValues = Array.from(document.querySelectorAll('.metric-input')).map(input => input.value);
      const notes = document.getElementById('logNotes').value;

      const rowData = [timestamp, ...metricValues, notes];

      if (isTokenValid() && spreadsheetId) {
        await appendRowToSheet(group.title, rowData);
        alert('Logged and successfully synced to Google Sheets!');
      } else {
        alert('Session expired. Please sign in again.');
        handleAuthClick();
      }
      showScreen('homeScreen');
    }

    // --- DASHBOARD CHARTS VIEW ---
    async function openDashboardView() {
      const idx = document.getElementById('dashboardSelect').value;
      const group = appData.dashboards[idx];
      if (!group) return alert('Please select a dashboard first.');

      document.getElementById('chartDashboardTitle').textContent = group.title;
      
      if (isTokenValid() && spreadsheetId) {
        await fetchDashboardRows(group);
      }

      showScreen('dashboardViewScreen');
      renderDashboardCharts(group);
    }

    async function fetchDashboardRows(group) {
      try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(group.title)}!A8:Z1000`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        group.rows = data.values || [];
      } catch (err) {
        console.error('Error fetching rows:', err);
        group.rows = [];
      }
    }

    function renderDashboardCharts(group) {
      const container = document.getElementById('chartsContainer');
      container.innerHTML = '';

      activeCharts.forEach(chart => chart.destroy());
      activeCharts = [];

      const rows = group.rows || [];
      const last10Rows = rows.slice(-10);
      const labels = last10Rows.map(r => r[0] ? new Date(r[0]).toLocaleDateString() : 'Unknown');

      if (group.metrics.length === 0) {
        container.innerHTML = '<p class="text-sm text-slate-500 text-center py-8">No metrics configured for this dashboard.</p>';
        return;
      }

      group.metrics.forEach((m, mIdx) => {
        const colIndex = mIdx + 1;
        const dataPoints = last10Rows.map(r => {
          const val = r[colIndex];
          return (val !== undefined && val !== '' && !isNaN(val)) ? parseFloat(val) : null;
        });

        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2';
        card.innerHTML = `
          <div class="flex justify-between items-baseline">
            <h3 class="font-bold text-sm text-slate-800">${m.title} <span class="text-xs font-normal text-slate-500">(${m.unit})</span></h3>
            <span class="text-xs text-indigo-600 font-medium">Range: ${m.min !== '' && m.min != null ? m.min : 'Any'} - ${m.max !== '' && m.max != null ? m.max : 'Any'}</span>
          </div>
          <div class="relative h-48 w-full">
            <canvas id="chart_${mIdx}"></canvas>
          </div>
        `;
        container.appendChild(card);

        const ctx = document.getElementById(`chart_${mIdx}`).getContext('2d');

        const minVal = (m.min !== '' && m.min != null) ? parseFloat(m.min) : null;
        const maxVal = (m.max !== '' && m.max != null) ? parseFloat(m.max) : null;

        const datasets = [{
          label: m.title,
          data: dataPoints,
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.1)',
          borderWidth: 2,
          tension: 0.1,
          fill: false,
          spanGaps: true
        }];

        if (minVal !== null) {
          datasets.push({
            label: 'Min Ideal',
            data: new Array(labels.length).fill(minVal),
            borderColor: 'rgba(239, 68, 68, 0.7)',
            borderDash: [4, 4],
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false
          });
        }
        if (maxVal !== null) {
          datasets.push({
            label: 'Max Ideal',
            data: new Array(labels.length).fill(maxVal),
            borderColor: 'rgba(239, 68, 68, 0.7)',
            borderDash: [4, 4],
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false
          });
        }

        const chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels.length > 0 ? labels : ['No Data'],
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: datasets.length > 1 }
            },
            scales: {
              y: { beginAtZero: false },
              x: { grid: { display: false } }
            }
          }
        });

        activeCharts.push(chart);
      });
    }

    // --- CONFIGURATION SCREEN ---
    function openConfigScreen() {
      showScreen('configScreen');
      renderConfigLists();
    }

    function renderConfigLists() {
      const select = document.getElementById('dashboardSelect');
      const activeIdx = Number(select.value || 0);
      const activeGroup = appData.dashboards[activeIdx];

      document.getElementById('configDashboardsList').innerHTML = appData.dashboards.map((g, i) => `
        <div class="flex items-center justify-between bg-slate-50 p-2 rounded border text-sm">
          <div>
            <p class="font-medium">${g.title}</p>
            <p class="text-xs text-slate-500">${g.description}</p>
          </div>
          <div class="space-x-2">
            <button onclick="editDashboard(${i})" class="text-xs text-blue-600 font-medium">Edit</button>
            <button onclick="deleteDashboard(${i})" class="text-xs text-red-600 font-medium">Delete</button>
          </div>
        </div>
      `).join('');

      document.getElementById('configActiveDashboardBadge').textContent = activeGroup ? activeGroup.title : 'None';
      document.getElementById('configMetricsList').innerHTML = activeGroup ? activeGroup.metrics.map((m, i) => {
        const rText = (m.min !== '' && m.min != null && m.max !== '' && m.max != null) ? ` | Range: ${m.min}-${m.max}` : '';
        return `
          <div class="flex items-center justify-between bg-slate-50 p-2 rounded border text-sm">
            <div>
              <p class="font-medium">${m.title} <span class="text-xs text-blue-600">(${m.unit}${rText})</span></p>
              <p class="text-xs text-slate-500">${m.description}</p>
            </div>
            <div class="space-x-2">
              <button onclick="editMetric(${i})" class="text-xs text-blue-600 font-medium">Edit</button>
              <button onclick="deleteMetric(${i})" class="text-xs text-red-600 font-medium">Delete</button>
            </div>
          </div>
        `;
      }).join('') : '<p class="text-xs text-slate-400">Select or create a dashboard first.</p>';
    }

    async function saveDashboard() {
      const title = document.getElementById('newDashboardTitle').value.trim();
      const description = document.getElementById('newDashboardDesc').value.trim();
      if (!title) return;

      if (editingDashboardIndex !== null) {
        appData.dashboards[editingDashboardIndex].title = title;
        appData.dashboards[editingDashboardIndex].description = description;
        editingDashboardIndex = null;
        document.getElementById('saveDashboardBtn').textContent = 'Add Dashboard';
      } else {
        appData.dashboards.push({ title, description, metrics: [], rows: [] });
      }

      document.getElementById('newDashboardTitle').value = '';
      document.getElementById('newDashboardDesc').value = '';
      renderUI();
      renderConfigLists();
      if (isTokenValid() && spreadsheetId) await syncStructureToSheets();
    }

    function editDashboard(idx) {
      const g = appData.dashboards[idx];
      document.getElementById('newDashboardTitle').value = g.title;
      document.getElementById('newDashboardDesc').value = g.description;
      editingDashboardIndex = idx;
      document.getElementById('saveDashboardBtn').textContent = 'Update Dashboard';
    }

    function deleteDashboard(idx) {
      appData.dashboards.splice(idx, 1);
      renderUI();
      renderConfigLists();
    }

    async function saveMetric() {
      const activeIdx = Number(document.getElementById('dashboardSelect').value || 0);
      const group = appData.dashboards[activeIdx];
      if (!group) return;

      const title = document.getElementById('newMetricTitle').value.trim();
      const description = document.getElementById('newMetricDesc').value.trim();
      const unit = document.getElementById('newMetricUnit').value.trim();
      const min = document.getElementById('newMetricMin').value;
      const max = document.getElementById('newMetricMax').value;
      if (!title) return;

      if (editingMetricIndex !== null) {
        group.metrics[editingMetricIndex] = { title, description, unit, min, max };
        editingMetricIndex = null;
        document.getElementById('saveMetricBtn').textContent = 'Add Metric';
      } else {
        group.metrics.push({ title, description, unit, min, max });
      }

      document.getElementById('newMetricTitle').value = '';
      document.getElementById('newMetricDesc').value = '';
      document.getElementById('newMetricUnit').value = '';
      document.getElementById('newMetricMin').value = '';
      document.getElementById('newMetricMax').value = '';
      renderConfigLists();
      if (isTokenValid() && spreadsheetId) await syncStructureToSheets();
    }

    function editMetric(idx) {
      const activeIdx = Number(document.getElementById('dashboardSelect').value || 0);
      const m = appData.dashboards[activeIdx].metrics[idx];
      document.getElementById('newMetricTitle').value = m.title;
      document.getElementById('newMetricDesc').value = m.description;
      document.getElementById('newMetricUnit').value = m.unit;
      document.getElementById('newMetricMin').value = m.min !== undefined ? m.min : '';
      document.getElementById('newMetricMax').value = m.max !== undefined ? m.max : '';
      editingMetricIndex = idx;
      document.getElementById('saveMetricBtn').textContent = 'Update Metric';
    }

    function deleteMetric(idx) {
      const activeIdx = Number(document.getElementById('dashboardSelect').value || 0);
      appData.dashboards[activeIdx].metrics.splice(idx, 1);
      renderConfigLists();
    }

    // --- GOOGLE AUTH & PERSISTENCE ---
    function isTokenValid() {
      return accessToken && Date.now() < tokenExpiry;
    }

    function updateAuthButtonState() {
      const btn = document.getElementById('authBtn');
      if (isTokenValid()) {
        btn.textContent = 'Connected';
        btn.classList.replace('bg-blue-600', 'bg-green-600');
      } else {
        btn.textContent = 'Sign in';
        btn.classList.replace('bg-green-600', 'bg-blue-600');
      }
    }

    function handleAuthClick() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        alert('Google Sign-In script is still loading. Please wait a moment and try again.');
        return;
      }

      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            tokenExpiry = Date.now() + (response.expires_in ? response.expires_in * 1000 : 3600 * 1000);
            
            localStorage.setItem('stats_access_token', accessToken);
            localStorage.setItem('stats_token_expiry', tokenExpiry);

            updateAuthButtonState();
            await ensureMasterSpreadsheet();
          }
        }
      });
      client.requestAccessToken();
    }

    async function ensureMasterSpreadsheet() {
      const q = encodeURIComponent("name='Statistics_Tracker_Data' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await res.json();

      if (data.files && data.files.length > 0) {
        spreadsheetId = data.files[0].id;
        localStorage.setItem('stats_spreadsheet_id', spreadsheetId);
        await loadStructureFromSheets();
      } else {
        const createRes = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            properties: { title: 'Statistics_Tracker_Data' },
            sheets: appData.dashboards.map(g => ({ properties: { title: g.title } }))
          })
        });
        const created = await createRes.json();
        spreadsheetId = created.spreadsheetId;
        localStorage.setItem('stats_spreadsheet_id', spreadsheetId);
        await syncStructureToSheets();
      }
    }

    async function loadStructureFromSheets() {
      const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?includeGridData=true`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const sheetDoc = await res.json();
      if (!sheetDoc.sheets) return;

      appData.dashboards = sheetDoc.sheets.map(s => {
        const rows = (s.data && s.data[0] && s.data[0].rowData) ? s.data[0].rowData : [];
        const getVal = (r, c) => rows[r]?.values?.[c]?.formattedValue || '';

        const title = getVal(0, 0) || s.properties.title;
        const description = getVal(1, 0) || '';
        const metrics = [];

        const row3 = rows[2]?.values || [];
        for (let c = 1; c < Math.max(1, row3.length - 1); c++) {
          if (getVal(2, c)) {
            metrics.push({
              title: getVal(2, c),
              description: getVal(3, c),
              unit: getVal(4, c),
              min: getVal(5, c),
              max: getVal(6, c)
            });
          }
        }
        return { sheetId: s.properties.sheetId, title, description, metrics, rows: [] };
      });
      renderUI();
    }

    async function syncStructureToSheets() {
      const metaRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const meta = await metaRes.json();
      const existingTitles = meta.sheets.map(s => s.properties.title);

      const requests = [];
      for (const group of appData.dashboards) {
        if (!existingTitles.includes(group.title)) {
          requests.push({ addSheet: { properties: { title: group.title } } });
        }
      }
      if (requests.length > 0) {
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ requests })
        });
      }

      for (const group of appData.dashboards) {
        const row1 = [group.title];
        const row2 = [group.description];
        const row3 = ['Timestamp', ...group.metrics.map(m => m.title), 'Notes'];
        const row4 = ['ISO Date/Time', ...group.metrics.map(m => m.description), 'Session Notes'];
        const row5 = ['ISO-8601', ...group.metrics.map(m => m.unit), 'Text'];
        const row6 = ['Min Value', ...group.metrics.map(m => m.min !== undefined ? m.min : ''), ''];
        const row7 = ['Max Value', ...group.metrics.map(m => m.max !== undefined ? m.max : ''), ''];

        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(group.title)}!A1:Z7?valueInputOption=USER_ENTERED`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ values: [row1, row2, row3, row4, row5, row6, row7] })
        });
      }
    }

    async function appendRowToSheet(sheetTitle, rowValues) {
      await syncStructureToSheets();

      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(sheetTitle)}!A1:append?valueInputOption=USER_ENTERED`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ values: [rowValues] })
      });
    }

    // Initialize UI and hash router on load
    window.addEventListener('load', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash === 'log') {
        openLogScreen();
      } else if (hash === 'dashboardView') {
        openDashboardView();
      } else if (hash === 'config') {
        openConfigScreen();
      } else {
        showScreen('homeScreen');
      }
      renderUI();
      updateAuthButtonState();
      if (isTokenValid() && spreadsheetId) {
        loadStructureFromSheets();
      }
    });
  </script>
</body>
</html>
