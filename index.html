<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stats Logger PWA</title>

  <!-- PWA & iOS Home Screen Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StatsLog" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

<!-- Tailwind CSS for mobile-first UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services & API -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">

  <div class="max-w-md mx-auto p-4 space-y-6">
    <!-- Top Bar / Auth Status -->
    <header class="flex items-center justify-between border-b pb-3">
      <h1 class="text-xl font-bold text-blue-600">Stats Logger</h1>
      <button id="authBtn" onclick="handleAuthClick()" class="text-sm bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm">
        Sign in with Google
      </button>
    </header>

    <!-- SCREEN 1: MAIN / HOME -->
    <section id="homeScreen" class="space-y-4">
      <div>
        <label for="groupingSelect" class="block text-sm font-medium text-slate-700 mb-1">
          Select Statistics Grouping
        </label>
        <select id="groupingSelect" onchange="onGroupingChange()" class="w-full rounded-lg border border-slate-300 bg-white p-3 text-base shadow-sm focus:border-blue-500 focus:outline-none">
        </select>
        <p id="groupingDescPreview" class="text-xs text-slate-500 mt-1"></p>
      </div>

      <div class="grid grid-cols-1 gap-3 pt-2">
        <button onclick="openLogScreen()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow">
          Log Entry
        </button>
        <button onclick="openConfigScreen()" class="w-full bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-semibold py-3 px-4 rounded-xl shadow-sm">
          Configuration
        </button>
      </div>
    </section>

    <!-- SCREEN 2: LOG SCREEN -->
    <section id="logScreen" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 id="logGroupingTitle" class="text-lg font-bold"></h2>
          <p id="logGroupingDesc" class="text-xs text-slate-500"></p>
        </div>
        <button onclick="showScreen('homeScreen')" class="text-sm text-slate-500 hover:text-slate-800">Cancel</button>
      </div>

      <form id="logForm" onsubmit="submitLog(event)" class="space-y-4">
        <div id="metricsInputsContainer" class="space-y-3"></div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
          <textarea id="logNotes" rows="3" placeholder="Optional session notes..." class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-xl shadow">
          Save to Google Sheets
        </button>
      </form>
    </section>
